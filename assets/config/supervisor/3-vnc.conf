[program:VNC]
# ANTech: noVNC is PUBLIC on Railway, so protect VNC with a password when
# VNC_PASSWORD is set (x11vnc -storepasswd -> -rfbauth). If unset, fall back to
# -nopw and log a warning. Applies to both the shared and non-shared branches.
command=bash -c 'sed -i "s/\$DESKTOP/$VNC_TITLE/g" /opt/novnc/index.html && if [ -n "$VNC_PASSWORD" ]; then x11vnc -storepasswd "$VNC_PASSWORD" /tmp/.vncpass >/dev/null 2>&1; VNC_AUTH="-rfbauth /tmp/.vncpass"; else echo "WARNING: VNC_PASSWORD not set, x11vnc running with -nopw (no password)" >&2; VNC_AUTH="-nopw"; fi; if ((VNC_SHARED==false)); then x11vnc $VNC_AUTH -rfbport 5900 -geometry $VNC_RESOLUTION -forever -alwaysshared -permitfiletransfer -noxrecord -noxfixes -noxdamage -dpms -bg -desktop $VNC_TITLE; else x11vnc $VNC_AUTH -rfbport 5900 -geometry $VNC_RESOLUTION -forever -shared -alwaysshared -permitfiletransfer -bg -desktop $VNC_TITLE; fi'
startsecs=0
autorestart=unexpected
stderr_logfile=/var/log/x11vnc.stderr.log
priority=3
