[program:Websockify]
# ANTech: noVNC is PUBLIC on Railway. When NOVNC_USER and NOVNC_PASSWORD are
# both set, add HTTP Basic auth via the BasicHTTPAuth plugin (requires
# websockify >= 0.11, installed in the Dockerfile). --web-auth extends the auth
# to the static noVNC web UI too (not just the WebSocket upgrade); without it
# the HTML page would be served unauthenticated. If unset, run without Basic
# auth and rely on the VNC password (VNC_PASSWORD) layer instead.
# NOTE: with --web-auth, GET / returns 401, so railway.toml uses TCP healthcheck.
command=bash -c 'if [ -n "$NOVNC_USER" ] && [ -n "$NOVNC_PASSWORD" ]; then AUTH="--web-auth --auth-plugin websockify.auth_plugins.BasicHTTPAuth --auth-source $NOVNC_USER:$NOVNC_PASSWORD"; else echo "WARNING: NOVNC_USER/NOVNC_PASSWORD not set, websockify HTTP Basic auth disabled (relying on VNC_PASSWORD)" >&2; AUTH=""; fi; exec websockify -D $AUTH --web=/opt/novnc/ $PORT localhost:5900'
startsecs=0
autorestart=unexpected
stderr_logfile=/var/log/websockify.stderr.log
priority=4
