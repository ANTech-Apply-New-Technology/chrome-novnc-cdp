[program:Chromium]
# ANTech: --lang/--accept-lang set Swedish locale for Swedish booking sites.
# --user-data-dir=/data/chromium persists cookies/logins on the Railway volume
# mounted at /data (dir created up-front so first boot on an empty volume works).
command=bash -c 'mkdir -p /data/chromium && exec chromium --no-sandbox --test-type --disable-dev-shm-usage --disable-gpu --start-maximized --lang=sv-SE --accept-lang=sv-SE,sv,en-US,en --user-data-dir=/data/chromium --remote-debugging-port=9223'
priority=5
autorestart=true
stderr_logfile=/var/log/chromium.err.log
