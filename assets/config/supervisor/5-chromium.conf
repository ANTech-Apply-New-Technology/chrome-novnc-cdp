[program:Chromium]
# ANTech: --lang/--accept-lang set Swedish locale for Swedish booking sites.
# --user-data-dir=/data/chromium persists cookies/logins on the Railway volume
# mounted at /data (dir created up-front so first boot on an empty volume works).
# rm -f Singleton{Lock,Socket,Cookie}: the profile lives on a PERSISTENT volume,
# so a previous container's lock survives restarts/redeploys. Chromium then sees
# "profile in use by another process on another computer" and exits immediately
# (crash-loop). Only ONE Chromium uses this profile (supervisor-managed), so
# clearing the stale singleton files on every boot is safe and required.
#
# CHROME_EXTRA_ARGS (optional, env): extra Chromium launch flags appended verbatim
# (word-split). Used to disable Site Isolation for cross-origin-iframe automation:
#   CHROME_EXTRA_ARGS="--disable-features=IsolateOrigins,site-per-process --disable-site-isolation-trials"
# Many booking widgets (e.g. BokaBord) are embedded in a CROSS-ORIGIN iframe.
# With Site Isolation on, that iframe is an out-of-process (OOPIF) target whose
# DOM the CDP automation client cannot serialize into clickable indices, so the
# agent can open the widget but never fill its fields. Disabling Site Isolation
# forces the iframe in-process so its DOM is reachable. These are automation-only
# browsers driven by one agent; SSRF is enforced at the navigation-policy layer
# (OpenClaw browser.ssrfPolicy / browser-use block_ip_addresses), NOT by Site
# Isolation, so the trade-off is acceptable here.
#
# RESIDENTIAL_PROXY_URL (optional, env): when set, page traffic egresses via the
# local credential-injecting forwarder (proxy_chain.py on 127.0.0.1:8118, see
# 8-proxy-chain.conf) toward the residential gateway. Loopback bypasses the
# proxy by Chromium default, so CDP/noVNC are unaffected. The WebRTC policy
# flag prevents UDP from leaking the datacenter IP around the proxy.
# NOTE: $PROXY_ARGS and ${CHROME_EXTRA_ARGS} are intentionally UNQUOTED — each
# must word-split into multiple argv tokens. Both must therefore contain only
# space-separated simple flags (no embedded spaces / quoted values).
# When RESIDENTIAL_PROXY_URL is set we wait (bounded) for proxy_chain (priority
# 4) to actually be LISTENING on the port before launching Chromium —
# supervisor priority controls start ORDER, not readiness, so without this the
# first navigation can race the proxy bind.
command=bash -c 'PROXY_ARGS=""; PC_PORT=${PROXY_CHAIN_PORT:-8118}; if [ -n "${RESIDENTIAL_PROXY_URL:-}" ]; then PROXY_ARGS="--proxy-server=http://127.0.0.1:$PC_PORT --webrtc-ip-handling-policy=disable_non_proxied_udp"; for i in $(seq 1 50); do python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex((\"127.0.0.1\",$PC_PORT))==0 else 1)" && break; sleep 0.1; done; fi; mkdir -p /data/chromium && rm -f /data/chromium/Singleton{Lock,Socket,Cookie} && exec chromium --no-sandbox --test-type --disable-dev-shm-usage --disable-gpu --start-maximized --lang=sv-SE --accept-lang=sv-SE,sv,en-US,en --user-data-dir=/data/chromium --remote-debugging-port=9223 $PROXY_ARGS ${CHROME_EXTRA_ARGS:-}'
priority=5
autorestart=true
stderr_logfile=/var/log/chromium.err.log
