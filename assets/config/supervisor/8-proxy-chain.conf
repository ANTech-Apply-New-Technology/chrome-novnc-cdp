[program:ProxyChain]
# ANTech: loopback-only credential-injecting forwarder for a residential
# upstream proxy (see /opt/proxy_chain.py). Without RESIDENTIAL_PROXY_URL it
# idles and Chromium runs with direct egress; with it, Chromium is launched
# with --proxy-server=http://127.0.0.1:8118 (see 5-chromium.conf) and all page
# traffic egresses via the residential gateway. Priority 4: must be listening
# before Chromium (priority 5) starts.
command=python3 /opt/proxy_chain.py
priority=4
autorestart=true
stderr_logfile=/var/log/proxy_chain.err.log
